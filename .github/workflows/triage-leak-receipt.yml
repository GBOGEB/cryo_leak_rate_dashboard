name: TRIAGE leak receipt
on:
  pull_request:
    paths:
      - 'scripts/triage_leak_receipt.py'
      - 'src/calc_leak_rate.py'
      - 'triage/**'
      - '.github/workflows/triage-leak-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - name: Reference throughput receipt
        run: python scripts/triage_leak_receipt.py --leak 1e-7 --temperature-k 293.15 --pressure-bar-abs 1.0 --reference-pressure-bar 1.0 > reference.json
      - name: Pressure sensitivity receipt
        run: python scripts/triage_leak_receipt.py --leak 1e-7 --temperature-k 293.15 --pressure-bar-abs 15.0 --reference-pressure-bar 1.0 > sensitivity.json
      - name: Validate semantic separation
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reference.json')); s=json.load(open('sensitivity.json'))
          assert r['interpretation']=='REFERENCE_THROUGHPUT_CONVERSION'
          assert s['interpretation']=='COMPARATIVE_PRESSURE_SENSITIVITY'
          assert r['release_credit'] is False and s['release_credit'] is False
          print('PASS leak evidence boundary')
          PY
